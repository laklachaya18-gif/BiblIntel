<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Fond du logo (livre stylisé) -->
  <rect x="5" y="5" width="50" height="50" rx="12" fill="white" opacity="0.95"/>
  
  <!-- Lignes du livre -->
  <rect x="12" y="15" width="36" height="4" rx="2" fill="#667eea"/>
  <rect x="12" y="24" width="28" height="4" rx="2" fill="#764ba2"/>
  <rect x="12" y="33" width="32" height="4" rx="2" fill="#667eea"/>
  <rect x="12" y="42" width="24" height="4" rx="2" fill="#764ba2"/>
  
  <!-- Texte BiblIntel -->
  <text x="70" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="white">Bibl</text>
  <text x="115" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#f39c12">Intel</text>
  
  <!-- Sous-titre -->
  <text x="70" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white" opacity="0.8">Bibliothèque Intelligente</text>
