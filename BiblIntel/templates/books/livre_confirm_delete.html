{% extends 'base.html' %} 
{% block title %}Supprimer - BiblIntel{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="form-premium text-center" data-aos="zoom-in">
        <div class="mb-4">
          <div
            class="d-inline-flex align-items-center justify-content-center mb-3"
            style="
              width: 100px;
              height: 100px;
              background: linear-gradient(135deg, var(--danger), #f87171);
              border-radius: 24px;
              box-shadow: 0 10px 40px rgba(239, 68, 68, 0.4);
            "
          >
            <i class="bi bi-exclamation-triangle fs-1 text-white"></i>
          </div>
          <h2 class="fw-bold mb-2" style="color: var(--danger)">
            Confirmer la suppression
          </h2>
          <p style="color: #94a3b8">
            Êtes-vous sûr de vouloir supprimer le livre<br />
            <strong style="color: #cbd5e1">"{{ livre.titre }}"</strong> ?<br />
            <span style="color: #64748b">Cette action est irréversible.</span>
          </p>
        </div>

        <form method="post" class="d-flex gap-3 justify-content-center">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger-glow">
            <i class="bi bi-trash me-2"></i>Oui, supprimer
          </button>
          <a
            href="{% url 'books:livre_detail' livre.pk %}"
            class="btn btn-glow"
            style="background: linear-gradient(135deg, #64748b, #94a3b8)"
          >
            <i class="bi bi-x-lg me-2"></i>Annuler
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
